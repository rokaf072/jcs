name: 신문 요약 갱신
on:
  schedule:
    - cron: '7,22,37,52 20-23 * * *'   # 한국시간 새벽 5시~아침 9시: 15분마다
    - cron: '7,37 0-14 * * *'          # 한국시간 오전 9시~밤 12시: 30분마다 (GitHub가 가끔 건너뛰어서 촘촘하게)
  workflow_dispatch:                     # Actions 화면에서 [Run workflow]로 바로 실행
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node news-build.mjs
      - name: 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "신문 요약 갱신"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
