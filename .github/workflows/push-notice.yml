name: 알림 보내기
on:
  push:
    paths: ['notice.json']
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node push-send.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          SUBS_URL: ${{ secrets.SUBS_URL }}
